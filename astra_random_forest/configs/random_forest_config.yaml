random_forest:
  version: "1.0.0"
  schema_version: "rf_features_v1"

  family_classes:
    - FSK
    - PSK
    - QAM
    - UNKNOWN

  quality_labels:
    - low_snr
    - clipped
    - multipath
    - cfo_affected

  family_model:
    n_estimators: 300
    max_depth: 14
    min_samples_split: 3
    min_samples_leaf: 2
    max_features: "sqrt"
    class_weight: "balanced"
    bootstrap: true
    random_state: 42
    n_jobs: -1

  quality_model:
    n_estimators: 200
    max_depth: 10
    min_samples_split: 4
    min_samples_leaf: 2
    max_features: "sqrt"
    random_state: 42
    n_jobs: -1

  quality_thresholds:
    low_snr_db_max: 3.0
    clipping_ratio_min: 0.05
    cfo_affected_hz_min: 500.0

  imputation:
    strategy: "median"

  feature_importance:
    impurity: true
    permutation: true
    n_repeats: 5
