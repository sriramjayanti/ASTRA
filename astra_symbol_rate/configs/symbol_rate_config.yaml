symbol_rate:
  candidate_merge_tolerance_percent: 2.0
  correct_tolerance_percent: 2.0
  dsp:
    autocorrelation:
      enabled: true
      max_sps: 256.0
      min_sps: 2.0
      prominence_threshold: 0.15
    bandwidth_rrc:
      enabled: true
      rolloff_alphas:
      - 0.2
      - 0.25
      - 0.35
      - 0.5
    cyclostationary:
      enabled: true
      num_cyclic_bins: 64
    instantaneous_frequency:
      enabled: true
      prominence_threshold: 0.12
    magnitude_squared:
      enabled: true
    spectral:
      enabled: true
      fft_size: 4096
  max_merged_candidates: 12
  max_raw_candidates: 30
  model_version: astra_symbol_rate_xgb_v1.0
  standard_rates:
    enabled: true
    values:
    - 300
    - 600
    - 1200
    - 2400
    - 4800
    - 9600
    - 19200
    - 24000
    - 38400
    - 48000
    - 56000
    - 57600
    - 115200
    - 250000
    - 500000
    - 1000000
  thresholds:
    confirmed: 0.82
    confirmed_margin: 0.18
    estimated: 0.5
    min_support_count_confirmed: 2
    possible: 0.28
  top_k: 3
  xgboost:
    colsample_bytree: 0.8
    early_stopping_rounds: 25
    enabled: true
    eval_metric: logloss
    learning_rate: 0.05
    max_depth: 5
    n_estimators: 300
    objective: binary:logistic
    random_state: 42
    scale_pos_weight: 3.0
    subsample: 0.8
version: 1.0.0
