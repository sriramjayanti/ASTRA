# ASTRA Central Model Registry Configuration
models:
  resnet1d:
    enabled: true
    checkpoint_path: "checkpoints/astra_resnet1d_modulation_v2.pt"
    architecture: "ResNet1DModClassifier"
    input_shape: [2, 2048]
    num_classes: 10
    classes: ["2-FSK", "4-FSK", "BPSK", "QPSK", "8PSK", "DQPSK", "MSK", "16QAM", "64QAM", "256QAM"]
    device: "auto"
  cnn2d:
    enabled: true
    checkpoint_path: "checkpoints/astra_spectrogram_cnn_v2.pt"
    architecture: "ASTRASpectrogramCNN"
    input_shape: [1, 128, 128]
    num_classes: 10
    classes: ["2-FSK", "4-FSK", "BPSK", "QPSK", "8PSK", "DQPSK", "MSK", "16QAM", "64QAM", "256QAM"]
    device: "auto"
  random_forest:
    enabled: true
    checkpoint_path: "checkpoints/random_forest_support.joblib"
    type: "scikit-learn"
  symbol_rate_ranker:
    enabled: true
    checkpoint_path: "checkpoints/symbol_rate_ranker.joblib"
    type: "joblib"
  pipeline_scorer:
    enabled: true
    model_dir: "checkpoints/pipeline_scorer_xgb"
    model_file: "xgboost_model.json"
    calibrator_file: "calibrator.joblib"
    schema_file: "feature_schema.json"
    type: "xgboost"
