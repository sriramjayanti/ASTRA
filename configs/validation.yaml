# ASTRA Validation Engine Configuration
validation:
  crc:
    profiles:
      - name: "CRC-8"
        poly: 0x07
        init: 0x00
        refin: false
        refout: false
        xorout: 0x00
      - name: "CRC-8-ATM"
        poly: 0x07
        init: 0x00
        refin: false
        refout: false
        xorout: 0x55
      - name: "CRC-16-CCITT"
        poly: 0x1021
        init: 0xFFFF
        refin: false
        refout: false
        xorout: 0x0000
      - name: "CRC-16-IBM"
        poly: 0x8005
        init: 0x0000
        refin: true
        refout: true
        xorout: 0x0000
      - name: "CRC-32-IEEE"
        poly: 0x04C11DB7
        init: 0xFFFFFFFF
        refin: true
        refout: true
        xorout: 0xFFFFFFFF
  frame_sync:
    preambles:
      - name: "barker_7"
        pattern: [1, 1, 1, 0, 0, 1, 0]
      - name: "barker_11"
        pattern: [1, 1, 1, 0, 0, 0, 1, 0, 0, 1, 0]
      - name: "barker_13"
        pattern: [1, 1, 1, 1, 1, 0, 0, 1, 1, 0, 1, 0, 1]
      - name: "sync_word_16"
        hex: "0xEB90"
      - name: "sync_word_32"
        hex: "0x1ACFFC1D"
    max_bit_errors_allowed: 1
