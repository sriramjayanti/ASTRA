project: ASTRA
component: modulation_classifier_v1

dataset:
  name: CSPB.ML.2018R2
  data_dir: data
  truth_file: data/truth.csv
  tim_dtype: float32
  window_size: 2048
  split_seed: 42
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15

classes:
  - bpsk
  - qpsk
  - 8psk
  - dqpsk
  - msk
  - 16qam
  - 64qam
  - 256qam

preprocessing:
  remove_dc: true
  normalization: rms
  epsilon: 1.0e-8

model:
  type: resnet1d
  input_channels: 2
  base_channels: 64
  num_classes: 8
  dropout: 0.2

training:
  output_dir: checkpoints
  batch_size: 64
  epochs: 40
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: AdamW
  loss: CrossEntropyLoss
