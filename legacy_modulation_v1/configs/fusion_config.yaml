# ASTRA Multi-Branch Modulation Fusion Engine Configuration
version: "1.0.0"

fusion:
  # Supported modes: "weighted_probability" or "learned"
  mode: "weighted_probability"
  
  # Default Top-K modulation candidates to produce
  top_k: 3

  # Branch definitions
  branches:
    resnet1d:
      model_name: "astra_resnet1d_v2"
      model_version: "2.0.0"
      checkpoint_path: "checkpoints/astra_resnet1d_modulation_v2.pt"
      weight: 0.75
      temperature: 1.0
      embedding_dim: 256
      input_shape: [2, 2048]

    spectrogram2d:
      model_name: "astra_spectrogram2d_v2"
      model_version: "2.0.0"
      checkpoint_path: "checkpoints/astra_spectrogram_cnn_v2.pt"
      weight: 0.25
      temperature: 1.0
      embedding_dim: 256
      stft:
        n_fft: 128
        hop_length: 32
        win_length: 128
        window: "hann"
        fftshift: true

  # Canonical 10-class modulation alphabet
  classes:
    - "2-FSK"
    - "4-FSK"
    - "BPSK"
    - "QPSK"
    - "8PSK"
    - "DQPSK"
    - "MSK"
    - "16QAM"
    - "64QAM"
    - "256QAM"

  # ASTRA Status decision thresholds (configuration-driven)
  thresholds:
    confirmed: 0.85
    estimated: 0.50
    possible: 0.30
    confirmed_margin: 0.20

  # Entropy and Uncertainty quantification
  entropy:
    enabled: true
    epsilon: 1.0e-12

  # Temperature scaling calibration
  calibration:
    enabled: false
    temperature_1d: 1.0
    temperature_2d: 1.0

  # Learned MLP Fusion Settings (Mode B)
  learned_fusion:
    hidden_dims: [256, 128]
    dropout: 0.20
    learning_rate: 0.0005
    weight_decay: 0.0001
    batch_size: 128
    epochs: 25
    early_stopping_patience: 5
